android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx8192m

# SOCKS5 proxy
systemProp.socksProxyHost=127.0.0.1
systemProp.socksProxyPort=2081
systemProp.java.net.socksProxyHost=127.0.0.1
systemProp.java.net.socksProxyPort=2081

# Versioning is generated automatically at build time from the current date and time
# (versionName yyyy.MM.dd.HHmm, versionCode yyMMddHHmm) in app/build.gradle.kts.
# APP_ID is still read from here.
APP_ID=org.fossify.messages
