android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx8192m

# SOCKS5 proxy
systemProp.socksProxyHost=127.0.0.1
systemProp.socksProxyPort=2081
systemProp.java.net.socksProxyHost=127.0.0.1
systemProp.java.net.socksProxyPort=2081

# Versioning is generated automatically at build time from the current date and time
# (versionName yyyy.MM.dd.HHmm, versionCode yyMMddHHmm) in app/build.gradle.kts.
# APP_ID is the applicationId: the package the app is installed as on the device and in the store.
# Fossify Commons gates its anti-repackaging checks on this value (packageName.startsWith("org.fossify.")
# in BaseSimpleActivity.onCreate, contains("fossify") in startCustomizationActivity, plus the primary-color
# gate in CustomizationActivity), so the id must keep the org.fossify. prefix or the app nag about being a
# "fake version" and locks the customization screen. The .r3r suffix keeps it a separate app from upstream.
# APP_NAMESPACE is the code namespace (R, BuildConfig, manifest component prefix); it stays on the
# source package org.fossify.messages, so changing APP_ID alone needs no source tree move.
APP_ID=org.fossify.messages.r3r
APP_NAMESPACE=org.fossify.messages
